name: Deploy GitHub Pages

on:
  push:
    branches: ['master', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Compute Pages base path
        id: pages_meta
        run: |
          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          owner_lc="$(echo "$owner" | tr '[:upper:]' '[:lower:]')"
          repo_lc="$(echo "$repo" | tr '[:upper:]' '[:lower:]')"
          if [ "$repo_lc" = "${owner_lc}.github.io" ]; then
            # User / organization page → served at https://<owner>.github.io/
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${owner_lc}.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${repo}/" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${owner_lc}.github.io/${repo}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        env:
          SITE_URL: ${{ steps.pages_meta.outputs.site_url }}
          BASE_PATH: ${{ steps.pages_meta.outputs.base }}
          GITHUB_ACTIONS: true
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Show built index header
        run: sed -n '1,40p' dist/404.html || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
