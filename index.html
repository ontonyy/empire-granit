<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b7a692" />
    <link rel="icon" type="image/x-icon" href="/empire-granit/public/favicon.ico" />
    <title>Empire Granit</title>
  </head>
  <body>
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get('p');
        if (redirect) {
          // Remove 'p' from the search params
          params.delete('p');
          var search = params.toString();
          var newUrl = window.location.pathname + redirect + (search ? '?' + search : '') + window.location.hash;
          // Clean up multiple slashes
          newUrl = newUrl.replace(/\/+/g, '/');
          window.history.replaceState(null, null, newUrl);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
