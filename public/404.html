<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // Extract the repo name (first segment) if it's there
        var parts = path.split('/').filter(Boolean);
        var repo = parts.length > 0 && parts[0] === 'empire-granit' ? '/empire-granit' : '';

        // Redirect to the root with the path as a query parameter 'p'
        var newPath = repo + '/?p=' + encodeURIComponent(path.replace(repo, '')) + search + hash;
        window.location.replace(newPath);
      })();
    </script>
  </body>
</html>
